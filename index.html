<!DOCTYPE html>
<!-- Version is set from APP_VERSION in app.js -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassTracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-name">ClassTracker</div>
      <div class="logo-sub">P–6 · All Subjects</div>
      <div id="sidebar-version" style="font-family:'DM Mono',monospace;font-size:var(--label-size);color:var(--text3);margin-top:4px;letter-spacing:0.1em">--</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Views</div>
      <button class="nav-btn active" onclick="showView('dashboard')" id="nav-dashboard">
        <span class="nav-icon">◈</span> Dashboard
      </button>
      <button class="nav-btn" onclick="showView('students')" id="nav-students">
        <span class="nav-icon">◎</span> Students
      </button>
      <button class="nav-btn" onclick="showView('overview')" id="nav-overview">
        <span class="nav-icon">▦</span> Class Overview
      </button>
      <!-- id must be nav-bulk-assess (not nav-bulk) to match syncNavHighlight()'s
           `nav-` + state.currentView lookup, which uses the view name 'bulk-assess'
           this button's own showView() call passes — the old nav-bulk id never
           matched that lookup, so this item never highlighted at all (found during
           the audit for other instances of the sidebar-highlight root cause). -->
      <button class="nav-btn" onclick="showView('bulk-assess')" id="nav-bulk-assess">
        <span class="nav-icon">⊞</span> Bulk Assess
      </button>
      <button class="nav-btn" onclick="openDailyLogWizard()" id="nav-log-today" style="position:relative">
        <span class="nav-icon">✦</span> Log Today
        <span id="daily-log-badge" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--gold);color:#0f1117;font-family:'DM Mono',monospace;font-size:var(--label-size);font-weight:700;padding:1px 5px;border-radius:8px">NEW</span>
      </button>
      <!-- id must be nav-daily-log (not nav-daily-log-view) to match syncNavHighlight()'s
           `nav-` + state.currentView lookup, which uses the view name 'daily-log' this
           button's own showView() call passes — a mismatch here previously caused this
           button and Log Today above (a non-view wizard launcher, not a real "view",
           so its id doesn't need to match anything) to collide on nav-daily-log,
           and the highlight lookup always found Log Today's button first. -->
      <button class="nav-btn" onclick="showView('daily-log')" id="nav-daily-log">
        <span class="nav-icon">◷</span> Session History
      </button>
      <button class="nav-btn" onclick="showView('unit-plans')" id="nav-unit-plans">
        <span class="nav-icon">▥</span> Unit Plans
      </button>
      <button class="nav-btn" onclick="showView('planner')" id="nav-planner">
        <span class="nav-icon">▤</span> Weekly Planner
      </button>
      <button class="nav-btn" onclick="showView('coverage')" id="nav-coverage">
        <span class="nav-icon">⬡</span> Coverage Gaps
      </button>
      <button class="nav-btn" onclick="showView('standards-judgments')" id="nav-standards-judgments">
        <span class="nav-icon">◈</span> Standards Judgments
      </button>
      <button class="nav-btn" onclick="showView('progression-placement')" id="nav-progression-placement">
        <span class="nav-icon">⟡</span> Progression Placement
      </button>
      <div class="nav-section">Browse Data</div>
      <button class="nav-btn" onclick="showView('curriculum')" id="nav-curriculum" style="position:relative">
        <span class="nav-icon">≡</span> Curriculum Codes
      </button>
      <button class="nav-btn" onclick="showView('standards')" id="nav-standards">
        <span class="nav-icon">◇</span> Standards
      </button>
      <button class="nav-btn" onclick="showView('progressions')" id="nav-progressions">
        <span class="nav-icon">⟡</span> Progressions
      </button>
      <div class="nav-section">Admin</div>
      <button class="nav-btn" onclick="showView('admin')" id="nav-admin">
        <span class="nav-icon">⚙</span> Data &amp; Settings
      </button>
    </div>
    <div class="sidebar-footer">
      <div class="sync-status">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-label">Connected</span>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main-content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading your data…</div>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- Test Mode sample/synthetic dataset (?testMode=1&sampleData=1) — a fixed fixture,
     harmless to load in every other mode too, since it just sits unused until
     app.js's SAMPLE_DATA_ACTIVE check reads it. Must load before app.js. -->
<script src="data/sample-test-mode-data.js"></script>
<script src="app.js"></script>
</body>
</html>
